- name: Dead Ends
  type: returning television series
  suggested_format: 6 x 45 or 6 x 60 minutes
  source_material: four novels and continuing
  screen_logline: A capable Leicester police team, pushed into institutional exile, investigates the cases nobody wants, each one placing an ordinary civilian at the psychological heart of a dangerous mystery.
  series_engine: Self-contained investigations combine a recurring ensemble procedural with the intimate viewpoint of the civilian whose life has been overturned.
  setting: Leicester and Leicestershire, England
  official_page: https://becklewis.com/dead-ends.html
  adaptation_genres:
  - British crime drama
  - police procedural
  - psychological thriller
- name: Female Rage
  type: limited television series or feature film
  source_material: novel series
  screen_logline: When every respectable system protects the corporate heir whose abuse destroyed her friend, relentlessly pleasant trainer Nicole Varkonyi turns to her eighty-year-old former-spy grandmother for the skills to dismantle the boys' club herself.
  series_engine: Each target exposes a wider network of protected men, professional fixers, predatory technology and bystanders who have mistaken pleasantness for powerlessness.
  setting: Birmingham, Warwickshire and rural Wales
  official_page: https://becklewis.com/female-rage.html
  adaptation_genres:
  - feminist revenge thriller
  - black comedy
  - female-led action thriller
- name: Dominion House
  type: returning television series
  suggested_format: 6 x 60 minutes
  source_material: two novels and continuing
  screen_logline: When a woman is found buried in Hagley Woods with her hands missing, a detective raised in a philosophical cult and a disgraced former policeman must identify her before another vulnerable woman disappears into the same hidden system.
  series_engine: Methodical cases unfold through an affectionate but understaffed major-crimes team, with Ash Rigney's unusual way of seeing reality at the centre.
  setting: Worcester and Worcestershire, England
  official_page: https://becklewis.com/dominion-house.html
  adaptation_genres:
  - British police procedural
  - regional crime drama
  - philosophical crime thriller
