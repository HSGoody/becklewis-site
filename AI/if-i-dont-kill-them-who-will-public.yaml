anti_tropes:
- Nicole's capacity for violence does not erase her humour, sociability or recognisably ordinary working life.
- Granny Róza is not a fragile dependent but an eighty-year-old former military officer and spy with practical combat knowledge.
- A flirtatious hacker connection remains secondary rather than rescuing Nicole or turning the book into a romance.
- The apparently harmless nice man is examined for what his passivity enables, not automatically treated as morally good.
- Nicole begins as an in-house trainer with no action-hero identity, and her competence is learned.
- Institutional justice does not arrive conveniently to solve the problem Nicole has identified.
