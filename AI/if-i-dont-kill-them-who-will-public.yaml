logline: When a protected corporate heir destroys her friend and the usual systems refuse to act, cheerful Birmingham trainer Nicole Varkonyi turns to her eighty-year-old former-spy grandmother for the skills to dismantle a toxic boys' club herself.
premise: >-
  Nicole Varkonyi is the delightful one at work: a ray of sunshine, an in-house trainer, the woman expected to smooth over everybody else's mess. Privately, she imagines her mind as a Dream Dacha repeatedly invaded by the Shit Shovellers whose entitlement and cruelty she is meant to tolerate. Then a member of the wealthy Bartlesham corporate dynasty shares an intimate video of Nicole's friend, and the consequences are devastating. HR, legal process and ordinary decency prove no match for a family built to protect its own. Nicole reaches an obvious conclusion: if she doesn't stop these men, nobody will. Fortunately, her eighty-year-old Hungarian grandmother is a former military officer and spy. Band Practice begins in a soundproofed clubhouse with concealed weapons, hard lessons and no illusions about what survival costs. As Nicole moves between Birmingham offices, Warwickshire privilege and an isolated Welsh lodge, her targets reveal a wider system of predatory data, compliant bystanders and professional fixers. The cheerful corporate trainer is still present. She has simply stopped confusing pleasantness with powerlessness.
main_characters:
- name: Nicole Varkonyi
  role: protagonist, narrator and Bartlesham corporate trainer
  description: Known as a cheerful delight at work, Nicole is grieving, observant and increasingly certain that being underestimated may be her most useful weapon.
- name: Granny Róza
  role: Nicole's grandmother and combat mentor
  description: An eighty-year-old former Hungarian military officer and spy whose arsenal, practical wisdom and uncompromising ethics transform Band Practice into something deadly serious.
- name: Daniel Bartlesham
  role: entitled corporate heir
  description: The protected son of a powerful family, convinced that women, colleagues and consequences can all be managed by somebody else.
- name: Eve
  role: Nicole's friend and emotional catalyst
  description: The friend whose violation and loss expose how comprehensively the ordinary systems around Nicole have failed.
- name: August Frederix
  role: Bartlesham family lawyer and fixer
  description: A cold, exact professional who treats human beings as unpalatable corporate situations to be contained.
- name: Ryan Lau
  role: data scientist
  description: A technologist whose use of personal data reveals a calculated new form of predation hidden behind corporate innovation.
- name: Lewis Wisby
  role: colleague and bystander
  description: An outwardly decent conflict-avoider whose passivity forces Nicole to ask how much harm nice men permit by doing nothing.
- name: Billie-Ann
  role: Nicole's friend and former colleague
  description: A spiritual, crystal-loving eccentric within Nicole's unconventional support network.
- name: Zoe
  role: Nicole's veterinarian friend
  description: A pragmatic ally able to bring medical knowledge and tactical calm to a situation spiralling beyond ordinary friendship.
- name: Boli
  role: hacker ally
  description: A flirtatious technical connection whose usefulness never displaces Nicole from the centre of her own story.
